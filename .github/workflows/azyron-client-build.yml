name: Build AZYRON CLIENT (MC 1.21.11)

on:
  workflow_dispatch:
  push:
    branches:
      - arena/6c14ec81-azyron-client
    paths:
      - 'azyron-client/**'
      - '.github/workflows/azyron-client-build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Compile mod + modpack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Minecraft 1.21.11 exists in Mojang manifest
        run: |
          curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json \
            | python3 -c "import sys,json; m=json.load(sys.stdin); vs=[v['id'] for v in m['versions']]; assert '1.21.11' in vs, '1.21.11 missing'; print('Minecraft 1.21.11 confirmed in Mojang manifest')"

      - name: Build AZYRON CLIENT mod JAR with Fabric Loom
        working-directory: azyron-client
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Report build errors as commit comment (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          log = open('/tmp/gradle-build.log').read()
          lines = [l for l in log.splitlines() if any(k in l.lower() for k in ('error', 'failure', 'caused by', 'went wrong', 'exception'))]
          excerpt = '\n'.join(lines[-60:]) or log[-4000:]
          body = '**AZYRON build failed — error excerpt:**\n```\n' + excerpt + '\n```'
          sha = os.environ['GITHUB_SHA']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/comments',
              data=json.dumps({'body': body}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          urllib.request.urlopen(req)
          EOF

      - name: Validate built JAR contains mod metadata
        working-directory: azyron-client
        run: |
          JAR=build/libs/azyron-client-1.0.jar
          test -f "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -q '"azyron-client"'
          unzip -p "$JAR" azyron-client.mixins.json | grep -q 'TitleScreenMixin'
          unzip -l "$JAR" | grep -q 'com/azyron/client/AzyronClient.class'
          echo "JAR validated: $(du -h "$JAR" | cut -f1)"

      - name: Assemble installation-ready modpack ZIP
        working-directory: azyron-client
        run: |
          python3 ../scripts/azyron_modpack.py 2>&1 | tee /tmp/modpack.log
          exit ${PIPESTATUS[0]}

      - name: Stage release artifacts
        run: |
          cp azyron-client/build/libs/azyron-client-1.0.jar Azyron-Client-1.0.jar
          cp azyron-client/modpack/Azyron-Client-Modpack-1.0.zip .
          ls -la Azyron-Client-1.0.jar Azyron-Client-Modpack-1.0.zip

      - name: Update PRIVATE draft release (never public without developer approval)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=azyron-client-1.0
          NOTES='AZYRON CLIENT 1.0 — private development build (MC 1.21.11 Fabric).
          DRAFT ONLY — not for public distribution. Release control: JIGNESH GAMING.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "AZYRON CLIENT 1.0 (PRIVATE DRAFT) — Minecraft 1.21.11" --notes "$NOTES"
            gh release upload "$TAG" Azyron-Client-1.0.jar Azyron-Client-Modpack-1.0.zip --clobber
          else
            gh release create "$TAG" Azyron-Client-1.0.jar Azyron-Client-Modpack-1.0.zip --draft --title "AZYRON CLIENT 1.0 (PRIVATE DRAFT) — Minecraft 1.21.11" --notes "$NOTES"
          fi
          gh release view "$TAG" --json isDraft --jq '.isDraft'

      - name: Report any failure as commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          parts = []
          for p in ('/tmp/gradle-build.log', '/tmp/modpack.log'):
              if os.path.exists(p):
                  log = open(p).read()
                  lines = [l for l in log.splitlines() if any(k in l.lower() for k in ('error', 'failure', 'caused by', 'went wrong', 'exception', 'traceback', 'RuntimeError'.lower()))]
                  parts.append('\n'.join(lines[-40:]) or log[-2000:])
          body = '**AZYRON build failed:**\n```\n' + ('\n---\n'.join(parts) or 'see job log') + '\n```'
          sha = os.environ['GITHUB_SHA']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/commits/{sha}/comments',
              data=json.dumps({'body': body[-60000:]}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          urllib.request.urlopen(req)
          EOF
